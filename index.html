<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mage Tarot Cards</title>
<style>
  :root {
    --bg: #0d0b1a;
    --surface: #1a1530;
    --border: #3a2f5c;
    --accent: #9b6dff;
    --accent2: #e0b84d;
    --text: #e8e0f8;
    --muted: #8a7aaa;
    --card-w: 260px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    text-align: center;
    padding: 2.5rem 1rem 1rem;
  }
  header h1 {
    font-size: 2rem;
    color: var(--accent2);
    letter-spacing: 0.08em;
    text-shadow: 0 0 20px #9b6dff88;
  }
  header p {
    color: var(--muted);
    margin-top: 0.4rem;
    font-size: 0.95rem;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    justify-content: center;
    align-items: center;
    padding: 1.5rem 1rem;
  }

  .btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.55rem 1.25rem;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .btn:hover { background: #2a2248; border-color: var(--accent); }
  .btn:active { transform: scale(0.97); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-size: 1rem;
    padding: 0.65rem 1.8rem;
    box-shadow: 0 0 18px #9b6dff55;
  }
  .btn.primary:hover { background: #b48aff; }

  select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.55rem 0.9rem;
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.9rem;
    cursor: pointer;
    outline: none;
  }
  select:focus { border-color: var(--accent); }

  #cards-area {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    justify-content: center;
    padding: 0.5rem 1.5rem 3rem;
    max-width: 1200px;
    width: 100%;
  }

  .card-slot {
    width: var(--card-w);
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeIn 0.4s ease both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(18px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card-frame {
    width: var(--card-w);
    cursor: pointer;
    perspective: 1000px;
    position: relative;
  }
  .card-frame:hover .card-inner {
    box-shadow: 0 8px 40px #9b6dff44, 0 0 0 1px var(--accent);
    transform: translateY(-4px);
  }
  .card-frame.flipped .card-inner {
    transform: rotateY(180deg);
  }
  .card-frame.flipped:hover .card-inner {
    transform: rotateY(180deg) translateY(-4px);
  }

  .card-frame.reversed .card-back,
  .card-frame.reversed .card-front {
    transform: rotateY(0deg) rotate(180deg);
  }
  .card-frame.reversed .card-front {
    transform: rotateY(180deg) rotate(180deg);
  }
  .card-frame.reversed:hover .card-inner {
    transform: translateY(-4px);
  }
  .card-frame.reversed.flipped .card-inner {
    transform: rotateY(180deg);
  }
  .card-frame.reversed.flipped:hover .card-inner {
    transform: rotateY(180deg) translateY(-4px);
  }

  .card-inner {
    position: relative;
    width: 100%;
    transform-style: preserve-3d;
    transition: transform 0.55s ease, box-shadow 0.2s;
    border-radius: 12px;
    box-shadow: 0 4px 30px #00000088, 0 0 0 1px #ffffff08;
  }

  .card-back,
  .card-front {
    width: 100%;
    display: block;
    border-radius: 12px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .card-back {
    position: relative;
  }
  .card-front {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    object-fit: cover;
    transform: rotateY(180deg);
  }

  .card-label {
    margin-top: 0.6rem;
    text-align: center;
    font-size: 0.82rem;
  }
  .card-label .suit {
    color: var(--accent);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .card-label .name {
    color: var(--text);
    margin-top: 0.15rem;
    font-size: 0.9rem;
  }
  .card-label .desc {
    color: var(--muted);
    font-size: 0.78rem;
    margin-top: 0.2rem;
    line-height: 1.4;
    max-width: 240px;
  }

  .hint {
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
    margin-top: -0.5rem;
    margin-bottom: 1rem;
  }

  .suit-badge {
    display: inline-block;
    font-size: 0.7rem;
    padding: 0.15rem 0.5rem;
    border-radius: 20px;
    margin-right: 0.3rem;
    border: 1px solid;
  }
  .suit-badge.major { color: #e0b84d; border-color: #e0b84d44; background: #e0b84d11; }
  .suit-badge.dynamism { color: #ff7e5f; border-color: #ff7e5f44; background: #ff7e5f11; }
  .suit-badge.pattern { color: #5fc8ff; border-color: #5fc8ff44; background: #5fc8ff11; }
  .suit-badge.primordialism { color: #7fff7e; border-color: #7fff7e44; background: #7fff7e11; }
  .suit-badge.questing { color: #ff9eee; border-color: #ff9eee44; background: #ff9eee11; }

  #back-img { display: none; }

  .card-slot { position: relative; }

  .card-tooltip {
    display: none;
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%);
    width: 260px;
    background: #1e1838ee;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 1rem;
    box-shadow: 0 8px 32px #00000099, 0 0 0 1px #9b6dff33;
    backdrop-filter: blur(6px);
    z-index: 100;
    pointer-events: none;
  }
  .card-slot:hover .card-tooltip { display: block; }
  .card-tooltip .tt-name {
    color: var(--accent2);
    font-size: 0.9rem;
    font-weight: bold;
    margin-bottom: 0.35rem;
  }
  .card-tooltip .tt-suit {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 0.5rem;
    opacity: 0.7;
  }
  .card-tooltip .tt-meaning {
    margin-top: 0.45rem;
  }
  .card-tooltip .tt-meaning-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.2rem;
    font-weight: bold;
  }
  .card-tooltip .tt-meaning-label.upright { color: var(--accent2); }
  .card-tooltip .tt-meaning-label.reversed { color: #ff7e7e; }
  .card-tooltip .tt-desc {
    color: var(--text);
    font-size: 0.8rem;
    line-height: 1.5;
    opacity: 0.9;
  }
  .card-tooltip hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 0.5rem 0;
  }
  .card-tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: var(--border);
  }
</style>
</head>

<header>

</div>

<p class="hint">Click a card to flip and reveal it</p>

<div id="cards-area"></div>

const SUIT_CLASS = {
  "Major Arcana": "major",
  "Dynamism": "dynamism",
  "Pattern": "pattern",
  "Primordialism": "primordialism",
  "Questing": "questing",
};

const BACK_SRC = "web_cards/cardback.png";

function sample(arr, n) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a.slice(0, Math.min(n, a.length)).map(c => ({ ...c, reversed: Math.random() < 0.5 }));
}

function cleanName(raw) {
  return raw.replace(/\.tif$/i, '').trim();
}

function draw() {
  const count = parseInt(document.getElementById('count-select').value);
  const suit = document.getElementById('suit-select').value;
  const pool = suit === 'all' ? CARDS : CARDS.filter(c => c.suit === suit);
  if (!pool.length) return;
  const drawn = sample(pool, count);
  renderCards(drawn);
}

function renderCards(drawn) {
  const area = document.getElementById('cards-area');
  area.innerHTML = '';
  drawn.forEach((card, i) => {
    const slot = document.createElement('div');
    slot.className = 'card-slot';
    slot.style.animationDelay = (i * 0.08) + 's';

    const frame = document.createElement('div');
    frame.className = 'card-frame';

    const inner = document.createElement('div');
    inner.className = 'card-inner';

    const back = document.createElement('img');
    back.className = 'card-back';
    back.alt = 'Card back';
    back.src = BACK_SRC;

    const front = document.createElement('img');
    front.className = 'card-front';
    front.src = card.path;
    front.alt = card.name;

    inner.appendChild(back);
    inner.appendChild(front);
    frame.appendChild(inner);
    if (card.reversed) frame.classList.add('reversed');
    frame.addEventListener('click', () => frame.classList.toggle('flipped'));

    const displayName = cleanName(card.name);
    const desc = DESCS[displayName];
    const orientation = card.reversed ? 'reversed' : 'upright';

    const label = document.createElement('div');
    label.className = 'card-label';
    label.innerHTML = `
      <div>
        <span class="suit-badge ${SUIT_CLASS[card.suit] || ''}">${card.suit}</span>
        ${card.reversed ? '<span class="suit-badge" style="color:#ff7e7e;border-color:#ff7e7e44;background:#ff7e7e11">Reversed</span>' : ''}
      </div>
      <div class="name">${displayName}</div>
    `;

    if (desc) {
      const tooltip = document.createElement('div');
      tooltip.className = 'card-tooltip';
      const shownDesc = desc[orientation];
      const otherLabel = orientation === 'upright' ? 'reversed' : 'upright';
      tooltip.innerHTML = `
        <div class="tt-name">${displayName}</div>
        <div class="tt-suit">${card.suit}</div>
        <div class="tt-meaning">
          <div class="tt-meaning-label ${orientation}">${orientation.charAt(0).toUpperCase() + orientation.slice(1)}</div>
          <div class="tt-desc">${shownDesc}</div>
        </div>
        <hr>
        <div class="tt-meaning">
          <div class="tt-meaning-label ${otherLabel}" style="opacity:0.45">${otherLabel.charAt(0).toUpperCase() + otherLabel.slice(1)}</div>
          <div class="tt-desc" style="opacity:0.45">${desc[otherLabel]}</div>
        </div>
      `;
      slot.appendChild(tooltip);
    }

    slot.appendChild(frame);
    slot.appendChild(label);
    area.appendChild(slot);
  });
}

function flipAll() {
  document.querySelectorAll('.card-frame').forEach(f => f.classList.add('flipped'));
}

function clearCards() {
  document.getElementById('cards-area').innerHTML = '';
}


</script>
