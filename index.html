<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mage Tarot Cards</title>
<style>
  :root {
    --bg: #0d0b1a;
    --surface: #1a1530;
    --border: #3a2f5c;
    --accent: #9b6dff;
    --accent2: #e0b84d;
    --text: #e8e0f8;
    --muted: #8a7aaa;
    --card-w: 260px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    text-align: center;
    padding: 2.5rem 1rem 1rem;
  }
  header h1 {
    font-size: 2rem;
    color: var(--accent2);
    letter-spacing: 0.08em;
    text-shadow: 0 0 20px #9b6dff88;
  }
  header p {
    color: var(--muted);
    margin-top: 0.4rem;
    font-size: 0.95rem;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    justify-content: center;
    align-items: center;
    padding: 1.5rem 1rem;
  }

  .btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.55rem 1.25rem;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .btn:hover { background: #2a2248; border-color: var(--accent); }
  .btn:active { transform: scale(0.97); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-size: 1rem;
    padding: 0.65rem 1.8rem;
    box-shadow: 0 0 18px #9b6dff55;
  }
  .btn.primary:hover { background: #b48aff; }

  select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.55rem 0.9rem;
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.9rem;
    cursor: pointer;
    outline: none;
  }
  select:focus { border-color: var(--accent); }

  #cards-area {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    justify-content: center;
    padding: 0.5rem 1.5rem 3rem;
    max-width: 1200px;
    width: 100%;
  }

  .card-slot {
    width: var(--card-w);
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeIn 0.4s ease both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(18px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card-frame {
    width: var(--card-w);
    cursor: pointer;
    perspective: 1000px;
    position: relative;
  }
  .card-frame:hover .card-inner {
    box-shadow: 0 8px 40px #9b6dff44, 0 0 0 1px var(--accent);
    transform: translateY(-4px);
  }
  .card-frame.flipped .card-inner {
    transform: rotateY(180deg);
  }
  .card-frame.flipped:hover .card-inner {
    transform: rotateY(180deg) translateY(-4px);
  }

  .card-inner {
    position: relative;
    width: 100%;
    transform-style: preserve-3d;
    transition: transform 0.55s ease, box-shadow 0.2s;
    border-radius: 12px;
    box-shadow: 0 4px 30px #00000088, 0 0 0 1px #ffffff08;
  }

  .card-back,
  .card-front {
    width: 100%;
    display: block;
    border-radius: 12px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .card-back {
    position: relative;
  }
  .card-front {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    object-fit: cover;
    transform: rotateY(180deg);
  }

  .card-label {
    margin-top: 0.6rem;
    text-align: center;
    font-size: 0.82rem;
  }
  .card-label .suit {
    color: var(--accent);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .card-label .name {
    color: var(--text);
    margin-top: 0.15rem;
    font-size: 0.9rem;
  }
  .card-label .desc {
    color: var(--muted);
    font-size: 0.78rem;
    margin-top: 0.2rem;
    line-height: 1.4;
    max-width: 240px;
  }

  .hint {
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
    margin-top: -0.5rem;
    margin-bottom: 1rem;
  }

  .suit-badge {
    display: inline-block;
    font-size: 0.7rem;
    padding: 0.15rem 0.5rem;
    border-radius: 20px;
    margin-right: 0.3rem;
    border: 1px solid;
  }
  .suit-badge.major { color: #e0b84d; border-color: #e0b84d44; background: #e0b84d11; }
  .suit-badge.dynamism { color: #ff7e5f; border-color: #ff7e5f44; background: #ff7e5f11; }
  .suit-badge.pattern { color: #5fc8ff; border-color: #5fc8ff44; background: #5fc8ff11; }
  .suit-badge.primordialism { color: #7fff7e; border-color: #7fff7e44; background: #7fff7e11; }
  .suit-badge.questing { color: #ff9eee; border-color: #ff9eee44; background: #ff9eee11; }

  #back-img { display: none; }
</style>
</head>
<body>

<header>
  <h1>Mage Tarot Cards</h1>
  <p>1st Edition &mdash; Card Draw</p>
</header>

<div class="controls">
  <select id="count-select">
    <option value="1">1 Card</option>
    <option value="3" selected>3 Cards</option>
    <option value="5">5 Cards</option>
  </select>
  <select id="suit-select">
    <option value="all">All Suits</option>
    <option value="Major Arcana">Major Arcana</option>
    <option value="Dynamism">Dynamism</option>
    <option value="Pattern">Pattern</option>
    <option value="Primordialism">Primordialism</option>
    <option value="Questing">Questing</option>
  </select>
  <button class="btn primary" onclick="draw()">Draw Cards</button>
  <button class="btn" onclick="flipAll()">Reveal All</button>
  <button class="btn" onclick="clearCards()">Clear</button>
</div>

<p class="hint">Click a card to flip and reveal it</p>

<div id="cards-area"></div>

const DESCS = {
  "0 Fool": "New beginnings, pure energy, infinite potential.",
  "1 Mage": "Will, creativity, mastery and the power of transformation.",
  "03 The Empress": "Fertility, nature, motherhood, abundance and creativity.",
  "4 Tarot Emperor": "Authority, structure, order and leadership.",
  "5 The Heirophant": "Tradition, spiritual guidance and institutional wisdom.",
  "6 The Lovers": "Love, harmony, values and important choices.",
  "7 The Chariot": "Victory, willpower, control and determination.",
  "8 Strength": "Inner strength, courage, patience and compassion.",
  "9 The Hermit": "Inner seeking, solitude, guidance and wisdom.",
  "10 Wheel Fortune": "Cycles, fate, turning points and fortune.",
  "11 Justice": "Justice, balance, truth and cause and effect.",
  "12 The Hanged Man": "Surrender, waiting, new perspective and sacrifice.",
  "13 Death": "Transformation, endings and new beginnings, change.",
  "14 Temperance": "Balance, moderation, patience and purpose.",
  "15 The Devil": "Bonds, materialism, shadow self and limitations.",
  "16 The Tower": "Sudden change, upheaval, liberation and breaking down.",
  "17 The Star": "Hope, inspiration, renewal and spirituality.",
  "18 Luna": "Intuition, the unconscious, fears and illusion.",
  "19 The Sun": "Joy, success, vitality and enlightenment.",
  "20 Judgement": "Awakening, rebirth, forgiveness and higher calling.",
  "21 Gaia": "Completion, wholeness, achievement and the world.",
  "2 High Priestess": "Intuition, mystery, the unconscious and inner wisdom.",
};

const SUIT_CLASS = {
  "Major Arcana": "major",
  "Dynamism": "dynamism",
  "Pattern": "pattern",
  "Primordialism": "primordialism",
  "Questing": "questing",
};

const BACK_SRC = "web_cards/cardback.png";

function sample(arr, n) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a.slice(0, Math.min(n, a.length));
}

function cleanName(raw) {
  return raw.replace(/\.tif$/i, '').trim();
}

function draw() {
  const count = parseInt(document.getElementById('count-select').value);
  const suit = document.getElementById('suit-select').value;
  const pool = suit === 'all' ? CARDS : CARDS.filter(c => c.suit === suit);
  if (!pool.length) return;
  const drawn = sample(pool, count);
  renderCards(drawn);
}

function renderCards(drawn) {
  const area = document.getElementById('cards-area');
  area.innerHTML = '';
  drawn.forEach((card, i) => {
    const slot = document.createElement('div');
    slot.className = 'card-slot';
    slot.style.animationDelay = (i * 0.08) + 's';

    const frame = document.createElement('div');
    frame.className = 'card-frame';

    const inner = document.createElement('div');
    inner.className = 'card-inner';

    const back = document.createElement('img');
    back.className = 'card-back';
    back.alt = 'Card back';
    back.src = BACK_SRC;

    const front = document.createElement('img');
    front.className = 'card-front';
    front.src = card.path;
    front.alt = card.name;

    inner.appendChild(back);
    inner.appendChild(front);
    frame.appendChild(inner);
    frame.addEventListener('click', () => frame.classList.toggle('flipped'));

    const label = document.createElement('div');
    label.className = 'card-label';
    const displayName = cleanName(card.name);
    label.innerHTML = `
      <div><span class="suit-badge ${SUIT_CLASS[card.suit] || ''}">${card.suit}</span></div>
      <div class="name">${displayName}</div>
      ${DESCS[displayName] ? `<div class="desc">${DESCS[displayName]}</div>` : ''}
    `;

    slot.appendChild(frame);
    slot.appendChild(label);
    area.appendChild(slot);
  });
}

function flipAll() {
  document.querySelectorAll('.card-frame').forEach(f => f.classList.add('flipped'));
}

function clearCards() {
  document.getElementById('cards-area').innerHTML = '';
}


</script>
